<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Jam 1: Magic</title>
    <link rel="stylesheet" href="../../../assets/base.css">
    <link rel="stylesheet" href="../../../assets/misc/webjam/magic/style.css">
</head>
<body>
    <div id="main">
        <div id="mushl"></div>
        <div id="mushr"></div>
        <div id="witch" class="tooltip">
            <span class="tooltiptext">come on in! :)</span>
        </div>
        <svg height="830" width="820" viewBox="0 200 820 630" xmlns="http://www.w3.org/2000/svg">
            <!-- bottom rectangle -->
            <polygon points="40,800 760,800 760,600 40,600" style="fill:#030206;stroke:black;stroke-width:5;" />
            <!-- left top triangle -->
            <polygon points="180,500 360,350 180,350" style="fill:#030206;stroke:black;stroke-width:5;" />
            <!-- left trapezoid roof -->
            <polygon points="150,350 400,350 400,250 200,250" style="fill:#280446;stroke:black;stroke-width:5;" />
            <!-- main triangle roof -->
            <polygon points="150,510 680,510 450,200" style="fill:#030206;stroke:black;stroke-width:20;" />
            <!-- triangle roof window base -->
            <polygon points="350,480 520,480 520,330 350,330" style="fill:#1F112B;stroke:black;stroke-width:5;" />
            <!-- triangle roof window -->
            <polygon points="370,460 500,460 500,350 370,350" style="fill:#5959E5;stroke:black;stroke-width:5;" />
            <!-- weird polygon roof -->
            <polygon points="0,600 400,600 400,640 800,640 700,500 100,500" style="fill:#280446;stroke:black;stroke-width:5;" />
            <!-- main house roof -->
            <polygon points="170,640 430,640 300,420" style="fill:black;stroke:black;stroke-width:5;" />
            <!-- main house base -->
            <polygon points="200,820 400,820 400,640 300,450 200,640" style="fill:#030206;stroke:black;stroke-width:5;" />
            <!-- door -->
            <polygon points="250,820 350,820 350,600 250,600" style="fill:#1F112B;stroke:black;stroke-width:5;" />
            <!-- window border lower -->
            <polygon points="460,750 680,750 680,640 460,640" style="fill:#1F112B;stroke:black;stroke-width:5;" />
            <!-- window left lower -->
            <polygon points="480,730 560,730 560,660 480,660" style="fill:#5959E5;stroke:black;stroke-width:5;" />
            <!-- window right lower -->
            <polygon points="580,730 660,730 660,660 580,660" style="fill:#5959E5;stroke:black;stroke-width:5;" />
        </svg>
     </div>
</body>
</html>
